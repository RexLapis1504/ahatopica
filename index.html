<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAUNCH ROOM · Boardroom Wars: The EV Race — Sample Play</title>
<meta name="description" content="Classroom boardroom game: stages of technology development and Ford's factors for technology exploitation. Solo sample play with bots.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Permanent+Marker&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-phase="title">
<header id="hud" class="hud">
  <div class="brand"><span class="logo">LAUNCH ROOM</span><span class="brand-sub mono">BOARDROOM WARS · SAMPLE PLAY</span></div>
  <div class="hud-mid">
    <span id="hud-phase" class="hud-phase mono">LOBBY</span>
    <div id="hud-timer" class="timer" aria-live="off"><i></i><span class="mono"></span></div>
    <button id="hud-skip" class="btn ghost sm" data-act="skip" hidden>Skip ▸</button>
  </div>
  <div class="hud-right">
    <span id="hud-co" class="hud-co mono"></span>
    <button class="btn sm" data-act="boards">Boards</button>
    <button id="hud-mute" class="btn ghost sm" data-act="mute" aria-pressed="false" aria-label="Music on or off">♪ on</button>
    <button id="hud-pause" class="btn ghost sm" data-act="pause" aria-pressed="false" aria-label="Pause or resume timers">❚❚</button>
  </div>
</header>
<div class="ticker" aria-hidden="true"><div class="ticker-in mono" id="ticker-in"><span>MARKET FEED ▸ LOADING…</span></div></div>
<main id="main" class="main"></main>
<footer id="foot" class="foot mono">Classroom simulation · cases simplified from public reports · deals between boards are in-game what-ifs · sample build: case facts being verified</footer>
<div id="overlay" class="overlay" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="flash" class="flash" aria-hidden="true"></div>
<canvas id="fx" class="fx" aria-hidden="true"></canvas>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
